[project]
name = "rmu-api-attack"
version = "0.4.1"
description = "RMU API Attack - FastAPI application for managing RPG attacks"
readme = { file = "README.adoc", content-type = "text/plain" }
requires-python = ">=3.11,<3.13"
authors = [
    { name = "Lab Cabrera", email = "labcabrera@example.com" },
]
dependencies = [
    "dependency-injector>=4.41.0,<5.0.0",
    "fastapi>=0.104.0,<0.105.0",
    "httpx>=0.25.2,<0.26.0",
    "motor>=3.3.0,<4.0.0",
    "pydantic>=2.4.0,<3.0.0",
    "pymongo>=4.5.0,<5.0.0",
    "python-multipart>=0.0.6,<1.0.0",
    "uvicorn[standard]>=0.24.0,<0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8.0.0",
    "pytest-asyncio>=0.21.0,<0.22.0",
    "ruff>=0.4.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "strict"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
